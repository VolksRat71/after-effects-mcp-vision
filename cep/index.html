<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>AE MCP Vision</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; padding: 14px;
      font: 12px/1.5 -apple-system, "Segoe UI", sans-serif;
      background: #1e1e1e; color: #d4d4d4;
    }
    h1 { font-size: 13px; margin: 0 0 10px; font-weight: 600; letter-spacing: .01em; }
    .row { display: flex; gap: 8px; align-items: baseline; margin-bottom: 4px; }
    .k { color: #8a8a8a; min-width: 96px; }
    .v { font-family: ui-monospace, Menlo, monospace; }
    .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
    .up { background: #4ec94e; } .down { background: #d45; } .wait { background: #c90; }
    .config {
      margin: 12px 0; padding: 8px; border-radius: 4px;
      background: #141414; border: 1px solid #333;
      font-family: ui-monospace, Menlo, monospace; font-size: 11px;
      white-space: pre; overflow-x: auto; user-select: all;
    }
    button {
      background: #333; color: #ddd; border: 1px solid #4a4a4a;
      border-radius: 4px; padding: 5px 11px; font-size: 11px; cursor: pointer;
    }
    button:hover { background: #3d3d3d; }
    .actions { display: flex; gap: 6px; }
    .tabs { display: flex; gap: 4px; margin: 12px 0 6px; flex-wrap: wrap; }
    .tab {
      background: transparent; border: 1px solid #3a3a3a; color: #9a9a9a;
      border-radius: 4px; padding: 4px 9px; font-size: 10px; cursor: pointer;
    }
    .tab.on { background: #2d2d2d; color: #e8e8e8; border-color: #5a5a5a; }
    .hint { color: #8a8a8a; font-size: 10px; margin-bottom: 4px; }
    #log {
      margin-top: 12px; height: 110px; overflow-y: auto;
      background: #141414; border: 1px solid #333; border-radius: 4px;
      padding: 6px; font-family: ui-monospace, Menlo, monospace; font-size: 10px;
      color: #9a9a9a; white-space: pre-wrap;
    }
    .err { color: #e06c6c; }
  </style>
</head>
<body>
  <h1>AE MCP Vision <span style="color:#6a6a6a;font-weight:400">· status</span></h1>
  <div class="row"><span class="k">Worker</span><span class="v"><span id="dot" class="dot wait"></span><span id="status">starting…</span></span></div>
  <div class="row"><span class="k">Node</span><span class="v" id="node">—</span></div>
  <div class="row"><span class="k">After Effects</span><span class="v" id="ae">—</span></div>

  <div id="tabs" class="tabs"></div>
  <div class="hint" id="hint"></div>
  <div class="config" id="config">waiting for server…</div>
  <div class="actions">
    <button id="copy">Copy config</button>
    <button id="recheck">Re-check</button>
  </div>

  <div id="log"></div>

  <script>
    /*
     * Never let the panel fail silently. If require() or Node is unavailable,
     * the page would otherwise sit on "starting..." forever with an empty log
     * and no way to tell whether the script ran at all.
     */
    (function () {
      var statusEl = document.getElementById('status');
      var logEl = document.getElementById('log');
      function fatal(stage, err) {
        var msg = 'FAILED at "' + stage + '": ' + (err && err.stack ? err.stack : err);
        if (statusEl) statusEl.textContent = 'failed - see log';
        var dot = document.getElementById('dot');
        if (dot) dot.className = 'dot down';
        if (logEl) {
          var line = document.createElement('div');
          line.className = 'err';
          line.textContent = msg;
          logEl.appendChild(line);
        }
        try {
          var os = require('os'), fs = require('fs'), path = require('path');
          var dir = path.join(os.tmpdir(), 'ae-mcp-vision');
          fs.mkdirSync(dir, { recursive: true });
          fs.appendFileSync(path.join(dir, 'boot.log'), new Date().toISOString() + ' panel ' + msg + '\n');
        } catch (e) { /* nothing left to report with */ }
      }
      var stage = 'start';
      try {
        stage = 'require()';
        if (typeof require !== 'function') {
          throw new Error('require() is not defined - --enable-nodejs did not take effect for this extension');
        }
        stage = 'node runtime';
        if (typeof process === 'undefined' || !process.version) {
          throw new Error('process is undefined - CEP did not expose a Node runtime');
        }
        stage = 'resolving extension root';
        // fileURLToPath, not location.pathname: on Windows the pathname is
        // "/C:/Users/...", which path.join turns into "\C:\..." - a path that does
        // not exist, so no install on Windows ever booted. fileURLToPath handles
        // drive letters and %20-decoding on both platforms.
        var root = require('path').dirname(
          require('url').fileURLToPath(window.location.href.split(/[?#]/)[0]));
        stage = "require(panel.js) from " + root;
        var panel = require(require('path').join(root, 'client', 'panel.js'));
        stage = 'panel.boot()';
        var p = panel.boot();
        if (p && typeof p.catch === 'function') { p.catch(function (e) { fatal('panel.boot() async', e); }); }
      } catch (err) {
        fatal(stage, err);
      }
    })();
  </script>
</body>
</html>
